<div class="section" id="testimonials">
    <div class="container">
        <header class="sec-head sec-head--center">
            <span class="sec-kicker">Testimonials</span>
            <h2 class="sec-title">What people say</h2>
            <p class="sec-sub"><a href="https://www.linkedin.com/in/appinv/">via LinkedIn</a></p>
        </header>

        <div class="testimonials-wrap">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    {%for testimonial in testimonials%}
                    <div class="swiper-slide">
                        <div class="testimonial-card">
                            <p class="testimonial-card__name">{{testimonial['name']}}</p>
                            <p class="testimonial-card__role">{{testimonial['title']}}</p>
                            <div class="testimonial-card__text">{{testimonial['text']}}</div>
                        </div>
                    </div>
                    {%endfor%}
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>

        <script>
        var swiper = new Swiper('.swiper-container', {
            autoHeight: true,
            spaceBetween: 30,
            hashNavigation: { watchState: true },
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
        });
        </script>
    </div>
</div>
