<div class="section section--alt" id="facts">
    <div class="container">
        <header class="sec-head sec-head--center">
            <span class="sec-kicker">Dev Journey</span>
            <h2 class="sec-title">Milestones</h2>
        </header>

        <div class="container--narrow" style="margin: 0 auto;">
            <div class="stat-row">
                <span class="stat-tag">
                    <span class="stat-tag__label">Dev.to article views</span>
                    <span class="stat-tag__value">58k</span>
                </span>
                <span class="stat-tag">
                    <span class="stat-tag__label">Codementor.io views</span>
                    <span class="stat-tag__value">46k</span>
                </span>
                <span class="stat-tag">
                    <span class="stat-tag__label">PyPI downloads</span>
                    <span class="stat-tag__value">166k</span>
                </span>
            </div>

            <div class="timeline">
                <header class="timeline-header">
                    <span class="tag is-medium is-primary">End</span>
                </header>

                {% for fact in reversed(settings.facts) %}
                {%if loop.index <=5 %}
                <div class="timeline-item">
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <p class="heading">
                            [{{fact['date']}}] <a href="{{ fact['link'] }}">{{ fact['title'] }}</a>
                        </p>
                        <p>{{fact['notes'] | safe }}</p>
                    </div>
                </div>
                {%endif%}
                {%endfor%}
            </div>

            <div style="margin-top: 1.5rem;">
                <a class="btn btn--ghost btn--sm" target="_blank" href="{{path}}journey">View dev journey &rarr;</a>
            </div>
        </div>
    </div>
</div>
