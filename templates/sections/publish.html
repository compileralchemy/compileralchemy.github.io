<div class="section" id="publish">
    <div class="container">
        <header class="sec-head sec-head--center">
            <span class="sec-kicker">Books &amp; Courses</span>
            <h2 class="sec-title">Writing and teaching</h2>
        </header>

        <div class="container--narrow" style="margin: 0 auto;">
            {% for pub in settings["publish"]%}
            <div style="padding: 1.25rem 0; border-bottom: 1px solid var(--line);">
                <p>
                    <a href='{{pub["link"]}}'><strong>{{pub["name"]}}</strong></a>
                    &nbsp;<span class="tag is-light">{{pub["type"]}}</span>
                </p>
                <p style="color: var(--ink-muted); font-size: 0.9rem; line-height: 1.6; margin-top: 0.3rem;">
                    {{pub["info"]}}
                </p>
            </div>
            {%endfor%}
        </div>
    </div>
</div>
