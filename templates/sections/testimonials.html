<div class="section" id="testimonials">
    <div class="container">
        <header class="sec-head sec-head--center">
            <span class="sec-kicker">Testimonials</span>
            <h2 class="sec-title">What people say</h2>
            <p class="sec-sub"><a href="https://www.linkedin.com/in/appinv/">via LinkedIn</a></p>
        </header>

        <div class="testimonials-wrap">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    {%for testimonial in testimonials%}
                    <div class="swiper-slide">
                        <div class="testimonial-card">
                            <p class="testimonial-card__name">{{testimonial['name']}}</p>
                            <p class="testimonial-card__role">{{testimonial['title']}}</p>
                            <div class="testimonial-card__text">{{testimonial['text']}}</div>
                        </div>
                    </div>
                    {%endfor%}
                </div>
            </div>

            <div class="testimonials-nav">
                <button class="tnav-btn tnav-prev" aria-label="Previous testimonial"><i class="fas fa-arrow-left"></i></button>
                <button class="tnav-btn tnav-next" aria-label="Next testimonial"><i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="testimonials-pagination">
                <div class="swiper-pagination"></div>
            </div>
        </div>
        </div>

        <script>
        var swiper = new Swiper('.swiper-container', {
            autoHeight: true,
            spaceBetween: 30,
            speed: 700,
            hashNavigation: { watchState: true },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
                renderBullet: function(index, className) {
                    return '<span class="' + className + '"></span>';
                },
            },
            navigation: {
                nextEl: '.tnav-next',
                prevEl: '.tnav-prev',
            },
            on: {
                slideChangeTransitionStart: function() {
                    if (this.activeIndex > this.previousIndex) {
                        var prev = this.slides[this.previousIndex];
                        if (prev) prev.classList.add('rip-slide');
                    }
                },
                slideChangeTransitionEnd: function() {
                    this.slides.forEach(function(slide) {
                        slide.classList.remove('rip-slide');
                    });
                }
            }
        });
        </script>
    </div>
</div>
