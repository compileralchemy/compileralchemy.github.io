<div class="section section--alt" id="blog-section">
    <div class="container">
        <header class="sec-head sec-head--center">
            <span class="sec-kicker">Blog</span>
            <h2 class="sec-title">Personal diary &amp; reflections</h2>
        </header>

        <div class="container--narrow" style="margin: 0 auto;">
            <ul class="bl-grid">
                {% for post in blog_posts %}
                <li class="bl-item">
                    <a href="{{ post.url }}" class="bl-link">
                        <span class="bl-num">{{ '%02d' | format(post.num) }}</span>
                        <span class="bl-title">{{ post.title }}</span>
                        <span class="bl-arrow">&rarr;</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
            <a href="{{ path }}blog" class="btn btn--ghost btn--sm">Read more posts &rarr;</a>
        </div>
    </div>
</div>

<style>
.bl-grid {
    list-style: none;
    padding: 0;
    margin: 0 0 1.25rem;
    display: grid;
    gap: 0.5rem;
}
.bl-item {
    background: var(--surface, #fff);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    transition: box-shadow .2s ease, transform .2s ease;
}
.bl-item:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    transform: translateY(-1px);
}
.bl-link {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.75rem 1rem;
    text-decoration: none;
    color: var(--ink);
}
.bl-num {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-muted);
    background: var(--surface-alt, #f5f5f5);
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    min-width: 2.2rem;
    text-align: center;
}
.bl-title {
    flex: 1;
    font-size: 0.92rem;
    font-weight: 500;
    line-height: 1.4;
}
.bl-arrow {
    flex-shrink: 0;
    color: var(--ink-muted);
    font-size: 0.9rem;
    transition: transform .2s ease, color .2s ease;
}
.bl-item:hover .bl-arrow {
    transform: translateX(4px);
    color: var(--accent, #dc2626);
}
@media (max-width: 480px) {
    .bl-title { font-size: 0.85rem; }
}
</style>
